services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TOPTIGER_DATA_DIR: /srv/data
    volumes:
      - toptiger_data:/srv/data
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      TOPTIGER_DATA_DIR: /srv/data
    volumes:
      - toptiger_data:/srv/data
volumes:
  toptiger_data:
