# RTX 4050 laptop GPU (typically 6 GB VRAM) override for a SINGLE GPU.
# Usage: docker compose -f docker-compose.yml -f deploy/gpu/docker-compose.gpu.yml #   -f deploy/gpu/docker-compose.rtx4050.yml up -d --build
#
# This adjusts the existing GPU overlay; it does NOT work without that overlay.
# If Windows, use Docker Desktop with WSL2 Linux containers + NVIDIA GPU support.
services:
  vllm:
    command:
      - "--model"
      - "${TOPTIGER_VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "1024"
      - "--max-num-seqs"
      - "2"
      - "--gpu-memory-utilization"
      - "0.70"
      - "--dtype"
      - "half"
